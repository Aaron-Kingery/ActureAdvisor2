version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: acture-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-acture_advisor}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - acture-network
    restart: always

  ollama:
    image: ollama/ollama:latest
    container_name: acture-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - acture-network
    restart: always

  backend:
    build:
      context: ./backend
    container_name: acture-backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-acture_advisor}
    depends_on:
      - db
      - ollama
    networks:
      - acture-network
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://advisor.acture.ai/api
    container_name: acture-frontend
    networks:
      - acture-network
    environment:
      - NEXT_PUBLIC_API_URL=https://advisor.acture.ai/api
      - NEXTAUTH_URL=https://advisor.acture.ai
      - NEXTAUTH_SECRET=supersecretvalue1234567890
    env_file:
      - ./frontend/.env.local
    # No ports exposed to host, only to bridge

  nginx:
    image: nginx:latest
    container_name: acture-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - acture-network
    restart: always
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: acture-certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    networks:
      - acture-network
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  backup:
    image: prodrigestivill/postgres-backup-local
    container_name: acture-backup
    restart: always
    # user: postgres:postgres # Optional: usually root is fine in this container
    volumes:
      - ./backups:/backups
    depends_on:
      - db
    networks:
      - acture-network
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=acture_advisor
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_EXTRA_OPTS=-Z9 --schema=public --blobs
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6

networks:
  acture-network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
